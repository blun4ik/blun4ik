<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blun4ik NOKIA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Фоновый трек и структура прелоадера/экрана Nokia с вашими ссылками на Telegram, TikTok и Twitch -->
    <audio id="bg-music" src="music.mp3" loop></audio>
    <div class="overlay" id="overlay">
        <div class="nokia-boot">
            <div class="hands-animation">🤝</div>
            <button class="enter-btn" id="enter-btn">Click To Start</button>
        </div>
    </div>
    <div class="nokia-phone-body">
        <div class="nokia-screen">
            <div class="nokia-top-bar">
                <div class="signal">▰▰▰▰▱</div>
                <div class="operator">NOKIA</div>
                <div class="battery">▰▰▰▰▰</div>
            </div>
            <div class="nokia-content hidden" id="main-content">
                <h1 class="nokia-title blink-text">blun4ik</h1>
                <div class="pixel-cigarette-wrapper">
                    <div class="smoke-particles"><span></span><span></span></div>
                    <div class="pixel-cigarette"><div class="filter"></div><div class="ash"></div></div>
                </div>
                <div class="nokia-menu-box">
                    <p>IP: <span id="ip">...</span></p>
                    <p>OS: <span id="os">...</span></p>
                    <p>BROWSER: <span id="browser">...</span></p>
                    <p>SESSION: <span>READY 🚬</span></p>
                </div>
                <div class="nokia-quote">
                    <div class="marquee-text">
                        <span>🚸 Текст песни доступен в полной версии скрипта с бегущей строкой (Тушил сигу в казаках...) 🚸</span>
                    </div>
                </div>
                <div class="nokia-links">
                    <a href="https://t.me/blun4iktg" target="_blank" class="nokia-btn">[ TELEGRAM ]</a>
                    <a href="https://t.me" target="_blank" class="nokia-btn">[ BOT ]</a>
                    <a href="https://tiktok.com" target="_blank" class="nokia-btn">[ TIKTOK ]</a>
                    <a href="https://twitch.tv" target="_blank" class="nokia-btn">[ TWITCH ]</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const enterBtn = document.getElementById('enter-btn');
        const overlay = document.getElementById('overlay');
        const mainContent = document.getElementById('main-content');
        const music = document.getElementById('bg-music');
        enterBtn.addEventListener('click', () => {
            music.currentTime = 0; 
            music.play().catch(() => {});
            overlay.style.display = 'none';
            mainContent.classList.remove('hidden');
        });
    </script>
</body>
</html>
